[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meeting-pipeline"
version = "0.1.0"
description = "Offline Vietnamese multi-device meeting transcription pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.30,<1",
  "jinja2>=3.1,<4",
  "librosa>=0.11,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "pyarrow>=19,<24",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "scikit-fuzzy>=0.5,<0.6",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "pyroomacoustics>=0.10.1",
  "streamlit>=1.64.0",
  "pandas>=3.0.5",
  "python-docx>=1.2.0",
]

[project.optional-dependencies]
ml = [
  "pyannote.audio==3.3.2",
  "silero-vad>=6.0,<7",
  "speechbrain>=1.0.3,<2",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "transformers>=4.49,<5",
]
evaluation = ["jiwer>=3.1,<5", "meeteval>=0.4,<1", "pyannote.metrics>=3.2,<4"]
dev = [
  "mypy>=1.15,<2",
  "playwright>=1.50,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "scipy-stubs>=1.15,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
meeting-pipeline = "meeting_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_pipeline"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["model_smoke: requires prepared model weights", "dataset: requires external datasets", "slow: long-running", "e2e: browser end-to-end"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["meeting_pipeline"]

[[tool.mypy.overrides]]
module = [
  "soundfile",
  "pyannote.audio",
  "pyannote.audio.*",
  "pyarrow",
  "pyarrow.*",
  "torchaudio",
  "silero_vad",
  "speechbrain.*",
  "transformers.*",
  "pyroomacoustics",
  "pyroomacoustics.*",
  "skfuzzy.*",
  "sklearn.*",
  "lxml.*",
]
ignore_missing_imports = true
